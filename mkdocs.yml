site_name: 量子力学从零到精通
site_description: 量子力学讲义——从黑体辐射到全同粒子，配 manim 动画可视化与知识点归纳
site_author: light
site_url: https://cockroach-f.github.io/quantum-mechanics/
repo_url: https://github.com/cockroach-f/quantum-mechanics
repo_name: cockroach-f/quantum-mechanics
edit_uri: edit/main/docs/
use_directory_urls: false
copyright: Copyright &copy; 2026 light · 教学用途 · 参考周世勋《量子力学教程》（第 3 版）教材

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - https://cockroach-f.github.io/sister-nav.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css
  - https://cockroach-f.github.io/sister-nav.css

nav:
  - 绪论与知识地图: index.md
  - 预备 原子的结构: atom.md
  - 第 1 章 绪论: ch1.md
  - 第 2 章 波函数和薛定谔方程: ch2.md
  - 第 3 章 量子力学中的力学量: ch3.md
  - 第 4 章 态和力学量的表象: ch4.md
  - 第 5 章 微扰理论: ch5.md
  - 第 6 章 散射（选读）: ch6.md
  - 第 7 章 自旋: ch7.md
  - 第 8 章 全同粒子: ch8.md
  - 全课程总结: summary.md
  - 附录:
      - 公式速查: formulas.md
      - 参考资料与致谢: references.md
